# Theme de login de GovSync — [HU-E01-01] / docs/DECISIONES.md D23.
#
# parent=keycloak: hereda cualquier plantilla/mensaje que este theme no
# sobreescriba (otros flujos de login que template.ftl/login.ftl no cubren,
# páginas de error, etc.) — nunca empezar un theme desde cero.
parent=keycloak
import=common/keycloak

# GENERADO con `npm run build:tema-keycloak` (Tailwind del frontend, mismos
# tokens que la aplicación). No editar a mano: ver README.
styles=css/govsync.css

# [E-01/HU-01] CA02: el login se muestra en español. Los mensajes propios están
# en messages/messages_es.properties; el realm tiene `es` como idioma por
# defecto (govsync-realm.json) y no ofrece otro.
locales=es
