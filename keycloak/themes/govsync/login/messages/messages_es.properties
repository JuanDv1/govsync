# Mensajes en español del theme de login de GovSync — [E-01/HU-01] CA02.
#
# Solo se sobreescribe lo que el theme base (parent=keycloak) no dice como
# pide el levantamiento. Archivo en UTF-8 (Keycloak 26 lo lee así).
#
# CA02: el mismo texto para usuario inexistente y contraseña incorrecta, sin
# indicar cuál falló (no revelar qué usuarios existen). Las tres claves son
# las que Keycloak usa según el punto donde falla la validación.
invalidUserMessage=Usuario o contraseña incorrectos
invalidUsernameMessage=Usuario o contraseña incorrectos
invalidPasswordMessage=Usuario o contraseña incorrectos
# El realm permite entrar con correo (loginWithEmailAllowed): mismo texto.
invalidUsernameOrEmailMessage=Usuario o contraseña incorrectos
invalidEmailMessage=Usuario o contraseña incorrectos
