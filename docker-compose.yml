# Levanta la base de datos de desarrollo. El backend y el frontend se ejecutan
# localmente (ver README) para conservar la recarga en caliente.
services:
  postgres:
    image: postgres:16-alpine
    container_name: govsync-postgres
    environment:
      POSTGRES_USER: govsync
      POSTGRES_PASSWORD: govsync
      POSTGRES_DB: govsync
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govsync -d govsync"]
      interval: 10s
      timeout: 5s
      retries: 5

  # [HU-E01-01] / docs/DECISIONES.md D23: Keycloak corre solo local por
  # ahora, sin decisión de producción. Base de datos propia embebida (la
  # que trae start-dev), no comparte el Postgres de arriba. El realm
  # "govsync", el cliente "govsync-backend" y los roles
  # (administrador/gestor/visitante) se crean a mano en la consola de
  # administración (http://localhost:8080) — no se automatiza todavía.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: govsync-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - datos_keycloak:/opt/keycloak/data
      # Theme de login con la marca de GovSync (D23, punto 4) — una vez
      # arriba, hay que seleccionarlo a mano en Realm settings > Themes >
      # Login theme. Montado de solo lectura: Keycloak lo lee, no lo escribe.
      - ./keycloak/themes/govsync:/opt/keycloak/themes/govsync:ro

volumes:
  datos_postgres:
  datos_keycloak:
