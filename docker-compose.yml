# Levanta la base de datos de desarrollo. El backend y el frontend se ejecutan
# localmente (ver README) para conservar la recarga en caliente.
services:
  postgres:
    image: postgres:16-alpine
    container_name: govsync-postgres
    environment:
      POSTGRES_USER: govsync
      POSTGRES_PASSWORD: govsync
      POSTGRES_DB: govsync
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govsync -d govsync"]
      interval: 10s
      timeout: 5s
      retries: 5

  # [HU-E01-01] / docs/DECISIONES.md D23: Keycloak corre solo local por
  # ahora, sin decisión de producción. Base de datos propia embebida (la
  # que trae start-dev), no comparte el Postgres de arriba.
  #
  # --import-realm + keycloak/import/govsync-realm.json: el realm
  # "govsync", los clients (govsync-backend/govsync-frontend, con sus
  # audience mappers), los 3 roles, el theme de login y los 3 usuarios de
  # prueba (uno por rol, ver ese archivo) se crean solos al arrancar —
  # nadie tiene que configurarlo a mano. Solo pasa en la PRIMERA vez que
  # arranca sobre un volumen nuevo: si `datos_keycloak` ya tiene un realm
  # "govsync" (de una corrida anterior), Keycloak no lo vuelve a importar
  # ni lo sobreescribe.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: govsync-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - datos_keycloak:/opt/keycloak/data
      # Theme de login con la marca de GovSync (D23, punto 4). Montado de
      # solo lectura: Keycloak lo lee, no lo escribe.
      - ./keycloak/themes/govsync:/opt/keycloak/themes/govsync:ro
      # Montar el DIRECTORIO, no el archivo suelto: en Docker Desktop para
      # Windows, el bind mount de un único archivo desde el host puede
      # llegarle vacío al proceso de Java/Quarkus (aunque `cat`/`wc` desde
      # una shell en el contenedor lo lean bien) -- problema conocido de su
      # capa de compartición de archivos, no de este archivo ni de Keycloak.
      - ./keycloak/import:/opt/keycloak/data/import:ro

volumes:
  datos_postgres:
  datos_keycloak:
