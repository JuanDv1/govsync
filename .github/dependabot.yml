version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # El flujo del equipo es develop -> main: los PRs de Dependabot entran por develop.
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 cambia el sistema de configuración y rompe los estilos actuales;
      # se migrará de forma planificada.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    # El flujo del equipo es develop -> main: los PRs de Dependabot entran por develop.
    target-branch: "develop"
    schedule:
      interval: "weekly"
