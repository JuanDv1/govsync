version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # El flujo del equipo es develop -> main: los PRs de Dependabot entran por develop.
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 cambia el sistema de configuración y rompe los estilos actuales;
      # se migrará de forma planificada.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # plugin-react 6 exige vite ^8.0.0 como peer dependency; el proyecto
      # corre sobre vite 7 (no declarado como dependencia directa en ningún
      # package.json). Sin ese peer satisfecho, npm instala una segunda
      # copia anidada de Vite 8 (con el bundler Rolldown) en vez de
      # resolver limpio. Migrar a Vite 8 debe ser su propia tarjeta,
      # declarando vite explícitamente y validando el dev-server a mano
      # — no algo que entre colgado de este bump.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    # El flujo del equipo es develop -> main: los PRs de Dependabot entran por develop.
    target-branch: "develop"
    schedule:
      interval: "weekly"
