name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      # --ignore-scripts: un paquete comprometido no puede ejecutar scripts de
      # instalación (equivalente a --only-binary en pip).
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      # --ignore-scripts: un paquete comprometido no puede ejecutar scripts de
      # instalación (equivalente a --only-binary en pip).
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      # --ignore-scripts: un paquete comprometido no puede ejecutar scripts de
      # instalación (equivalente a --only-binary en pip).
      - run: npm ci --ignore-scripts
      - run: npm run build

  backend-calidad:
    name: Backend — lint, formato y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install --require-hashes --only-binary ":all:" -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # La cobertura mínima del DoD (70 %) se exige aquí, no en pyproject.toml,
      # para no bloquear la ejecución local durante el desarrollo.
      - run: python -m pytest --cov-fail-under=70
      - name: Publica el reporte de cobertura para SonarCloud
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          retention-days: 7

  backend-migraciones:
    name: Backend — migraciones contra PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: govsync
          POSTGRES_PASSWORD: govsync
          POSTGRES_DB: govsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govsync -d govsync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://govsync:govsync@localhost:5432/govsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install --require-hashes --only-binary ":all:" -r requirements.txt
      # Ida y vuelta completa: valida upgrade, downgrade (incluye el drop
      # manual de los tipos ENUM) y un segundo upgrade sin colisiones.
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head

  backend-keycloak:
    name: Backend — Keycloak arranca correctamente
    runs-on: ubuntu-latest
    # [HU-E01-01] / docs/DECISIONES.md D23: smoke test, no prueba de
    # integración completa todavía. No usa services: porque ese bloque no
    # admite pasarle el comando start-dev a la imagen de Keycloak — se
    # levanta con `docker run` directamente. Solo confirma que la imagen,
    # el puerto y las variables de docker-compose.yml arrancan de verdad en
    # el runner de GitHub (Linux, distinto al entorno local). No crea
    # realm/cliente/rol ni valida un token real — eso es una tarjeta
    # siguiente.
    steps:
      - name: Levanta un Keycloak efímero
        run: |
          docker run -d --name keycloak-ci \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.7 start-dev
      - name: Espera a que Keycloak responda
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/realms/master > /dev/null; then
              echo "Keycloak respondió tras $((i*2))s."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Keycloak no respondió en 60s."
          docker logs keycloak-ci
          exit 1
      - name: Detiene el contenedor
        if: always()
        run: docker rm -f keycloak-ci

  migrate-render:
    name: Backend — migra y despliega en Render
    runs-on: ubuntu-latest
    needs: [backend-calidad, backend-migraciones]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Nunca dos migraciones/despliegues a la vez contra producción. No se cancela
    # la ejecución en curso (cortar una migración a la mitad es peor): la nueva
    # espera en cola.
    concurrency:
      group: produccion-render
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install --require-hashes --only-binary ":all:" -r requirements.txt
      # Solo upgrade -- nunca downgrade contra Render (backend-migraciones,
      # arriba, sí hace upgrade->downgrade->upgrade, pero contra una base
      # de Postgres desechable de CI, no contra datos reales). Ver
      # docs/DESPLIEGUE.md §4: este job NO hace respaldo antes de migrar.
      - run: alembic upgrade head
      # Despliega DESPUÉS de migrar: el orden queda pruebas -> migración -> despliegue.
      # En Render el Auto-Deploy se apaga para que este sea el único disparador.
      # La URL del hook es secreta (quien la tenga puede desplegar): se pasa por env, nunca
      # interpolada en el script, y no se imprime la respuesta.
      # Si el hook falla después de migrar, el esquema queda adelantado al código:
      # se reintenta 3 veces y, si igual falla, el job queda en rojo y aplica el
      # Plan B de docs/DESPLIEGUE.md (Manual Deploy en Render).
      - name: Dispara el despliegue en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Despliegue solicitado a Render."

  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --ignore-scripts: un paquete comprometido no puede ejecutar scripts de
      # instalación (equivalente a --only-binary en pip).
      - run: npm ci --ignore-scripts
      # Binario ya instalado y fijado en package-lock.json; `npx` podría
      # descargar un paquete no fijado.
      - run: git log -1 --pretty=%B | ./node_modules/.bin/commitlint --config commitlint.config.cjs

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Depende de backend-calidad para reutilizar su coverage.xml (artefacto
    # cobertura-backend) en vez de correr pytest dos veces; sin él, SonarCloud
    # reporta cobertura 0 %. Si las pruebas fallan, este job queda "skipped" a
    # propósito: correrlo igual (`if: always()`) publicaría una cobertura 0 %
    # engañosa. La señal del fallo es el job backend-calidad en rojo.
    needs: [backend-calidad]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Descarga el reporte de cobertura
        uses: actions/download-artifact@v8
        with:
          name: cobertura-backend
          path: backend
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
