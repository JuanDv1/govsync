sonar.projectKey=JuanDv1_govsync
sonar.organization=juandv1
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/venv/**,**/dist/**,**/build/**,**/__pycache__/**,**/.pytest_cache/**,**/.ruff_cache/**,**/graphify-out/**,backend/alembic/versions/**,backend/tests/**,frontend/coverage/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**
# Alineado con [tool.coverage.run] de backend/pyproject.toml (omit main.py y alembic).
# frontend/ y keycloak/ (tema de login) se excluyen SOLO de la métrica de cobertura, no del
# análisis (no están en sonar.exclusions: el código se sigue analizando). Ya tienen pruebas en
# Vitest (335 en 10 archivos, 157 de ellas del tema de Keycloak), pero su cobertura todavía no se
# reporta a Sonar: se hará en la tarjeta "[DEV] Reportar la cobertura del frontend (Vitest/lcov)
# a SonarCloud". Se declara de forma explícita, no se oculta. backend/scripts/ son utilidades
# manuales de carga de datos, fuera del código de la aplicación.
sonar.coverage.exclusions=frontend/**,keycloak/**,backend/scripts/**,backend/alembic/**,backend/app/main.py
