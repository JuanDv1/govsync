sonar.projectKey=JuanDv1_govsync
sonar.organization=juandv1
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/venv/**,**/dist/**,**/build/**,**/__pycache__/**,**/.pytest_cache/**,**/.ruff_cache/**,**/graphify-out/**,backend/alembic/versions/**,backend/tests/**,frontend/coverage/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,**/*.test.js,**/*.test.jsx
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Alineado con [tool.coverage.run] de backend/pyproject.toml (omit main.py y alembic).
# La cobertura del frontend y del tema de Keycloak la genera Vitest (lcov, artefacto
# cobertura-frontend del CI). Sus rutas en el lcov son relativas a frontend/ (y
# ../keycloak/... para el tema): el job sonarcloud las reescribe a la raíz del repo antes del
# escaneo. backend/scripts/ son utilidades manuales de carga de datos, fuera del código de la
# aplicación.
sonar.coverage.exclusions=frontend/src/main.jsx,backend/scripts/**,backend/alembic/**,backend/app/main.py
