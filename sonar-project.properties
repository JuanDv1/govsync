sonar.projectKey=JuanDv1_govsync
sonar.organization=juandv1
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/venv/**,**/dist/**,**/build/**,**/__pycache__/**,**/.pytest_cache/**,**/.ruff_cache/**,**/graphify-out/**,backend/alembic/versions/**,backend/tests/**,frontend/coverage/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**
# Alineado con [tool.coverage.run] de backend/pyproject.toml (omit main.py y alembic).
# frontend/ se excluye de la métrica de cobertura porque aún no tiene pruebas automatizadas
# (se reporta de forma explícita en la entrega, no se oculta). backend/scripts/ son utilidades
# manuales de carga de datos, fuera del código de la aplicación.
sonar.coverage.exclusions=frontend/**,backend/scripts/**,backend/alembic/**,backend/app/main.py
